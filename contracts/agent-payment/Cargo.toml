[package]
name = "agent-payment"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=22.0.11"

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
# soroban-env-host 22.1.3 allows ed25519-dalek >=2.0.0, which can
# resolve to 3.x and break its rand 0.8 testutils integration.
# Pin the compatible 2.1.x line for reproducible CI.
ed25519-dalek = "=2.1.1"

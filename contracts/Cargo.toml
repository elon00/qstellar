[workspace]
resolver = "2"
members = [
    "qstellar-token",
    "agent-payment",
    "service-registry",
    "pqc-verifier",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

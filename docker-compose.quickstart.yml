services:
  stellar:
    image: stellar/quickstart:latest
    container_name: qstellar-quickstart
    command: ["--local", "--enable", "core,horizon,rpc,lab", "--limits", "testnet"]
    ports:
      - "8000:8000"
      - "11626:11626"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

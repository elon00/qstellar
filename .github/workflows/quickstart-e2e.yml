name: QSTELLAR Quickstart E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quickstart-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Start local Stellar network
        uses: stellar/quickstart@main
        with:
          tag: latest
          network: local
          enable: core,horizon,rpc,lab
          enable_logs: "true"

      - name: Verify Quickstart services
        run: node scripts/quickstart-smoke.js

      - name: Run application and contract tests
        run: node scripts/run-all-tests.js

      - name: Build Soroban WASM
        run: cargo build --release --manifest-path contracts/Cargo.toml --target wasm32v1-none

      - name: Smoke-test web console
        run: |
          node apps/web/server.js > /tmp/qstellar-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Web console healthy"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qstellar-web.log
          exit 1
